modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/BackupBackupFede/bulk-trade/issues"

[[mods]]
modId = "bulktrade"
version = "${file.jarVersion}"
displayName = "Bulk Villager Trading"
authors = "AceOverDeuce"
credits = "Soutien : https://ko-fi.com/acesoverdeuces777"
displayURL = "https://github.com/BackupBackupFede/bulk-trade"
logoFile = "icon.png"
description = '''
Vide tout ton stock chez un marchand en un seul shift-clic, sans quitter l'UI de trade.

Le vanilla enchaine deja les echanges au shift-clic, mais s'arrete des que les 2 cases
de paiement sont vides. Ce mod recharge ces cases depuis ton inventaire -> un clic
ecoule TOUT ton stock. Tu restes dans le menu, tu choisis ton trade : zero risque de
mauvais echange. Cote serveur, sans dependance.

Support : https://ko-fi.com/acesoverdeuces777
'''

# --- Mixin ---
[[mixins]]
config = "bulktrade.mixins.json"

# --- Dependances ---
[[dependencies.bulktrade]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.bulktrade]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
