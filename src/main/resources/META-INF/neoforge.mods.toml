modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/BackupBackupFede/bulk-trade/issues"

[[mods]]
modId = "bulktrade"
version = "${file.jarVersion}"
displayName = "Bulk Villager Trading"
authors = "AceOverDeuce"
credits = "Soutien : https://ko-fi.com/acesoverdeuces777"
displayURL = "https://github.com/BackupBackupFede/bulk-trade"
logoFile = "icon.png"
description = '''
Trade your whole stock with a merchant in a single shift-click, without leaving the trade UI.

Vanilla already chains trades on shift-click, but stops as soon as the 2 payment slots are
empty. This mod refills those slots from your inventory -> one click trades your ENTIRE
stock. You stay in the menu and pick the exact trade: no mis-trades. Server-side, no
dependencies.

Support: https://ko-fi.com/acesoverdeuces777
'''

# --- Mixin ---
[[mixins]]
config = "bulktrade.mixins.json"

# --- Dependances ---
[[dependencies.bulktrade]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.bulktrade]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
