plugins {
    id 'java'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

base {
    archivesName = "${rootProject.mod_id}-fabric-${rootProject.mcVersion}"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.mcVersion}"

    if (rootProject.mcObfuscated) {
        // Obfuscated Minecraft (1.21.x): Loom needs a mappings layer. Use Mojang mappings so the
        // common mixin (compiled in Mojmap) applies without a refmap.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loaderVersion}"
    } else {
        // MC 26.x ships de-obfuscated (real names) -> no mappings layer, plain implementation.
        implementation "net.fabricmc:fabric-loader:${rootProject.loaderVersion}"
    }

    compileOnly project(':common')

    // MixinExtras annotation processor to (re)compile the common mixin here.
    annotationProcessor "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        server {
            server()
            runDir 'run'
        }
        client {
            client()
            runDir 'run'
        }
    }
}

// Pull the common module's sources and resources straight into this loader jar.
tasks.named('compileJava', JavaCompile) {
    source(project(':common').sourceSets.main.allSource)
}

tasks.named('processResources', ProcessResources) {
    from project(':common').sourceSets.main.resources
}
